services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miu
      POSTGRES_PASSWORD: miu
      POSTGRES_DB: miu_export_hub
      # Dev only: allow connections without a password (pgAdmin, psql, etc.)
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miu -d miu_export_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8030}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://miu:miu@db:5432/miu_export_hub
      JWT_SECRET: ${JWT_SECRET:-dev-docker-secret-change-in-production}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-30}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      STORAGE_PATH: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SEED_ON_START: ${SEED_ON_START:-true}
      MAIL_ENABLED: "true"
      MAIL_HOST: email-smtp.eu-north-1.amazonaws.com
      MAIL_PORT: "587"
      MAIL_USERNAME: AKIARNORCLGWLSJG5Z5G
      MAIL_PASSWORD: BFSLny+VryGv1JCENpWEYoVP6kAHel24ugUMEk2LhHRj
      MAIL_ENCRYPTION: tls
      MAIL_FROM_EMAIL: info@madeinuganda.co.ug
      MAIL_FROM_NAME: Made in Uganda
    volumes:
      - uploads_data:/app/uploads
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@miu.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  pgadmin_data:
